name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish npm package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Install baseline OpenCode
        run: npm install --global opencode-ai@1.18.21
      - name: Smoke installed tarball on baseline OpenCode
        run: bun run package:smoke
        env:
          OPENCODE_SMOKE_STRICT: "1"
          OPENCODE_SMOKE_VERSION: "1.18.21"
      - name: Install latest stable OpenCode
        run: npm install --global opencode-ai@latest
      - name: Smoke installed tarball on latest stable OpenCode
        run: bun run package:smoke
        env:
          OPENCODE_SMOKE_STRICT: "1"
          OPENCODE_SMOKE_VERSION: any
      - name: Verify tag matches package version
        run: >-
          node -e "const p=require('./package.json');
          if (process.env.GITHUB_REF_NAME !== 'v' + p.version) {
            throw new Error('Tag must equal v' + p.version)
          }"
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
