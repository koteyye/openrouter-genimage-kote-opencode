name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_openrouter_e2e:
        description: Run explicitly budgeted, paid OpenRouter E2E tests
        required: false
        default: false
        type: boolean
      run_openrouter_credits_e2e:
        description: Also query account credits with the management key
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  package-smoke:
    name: npm tarball smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run package:smoke

  opencode-smoke:
    name: OpenCode ${{ matrix.runtime }} registration smoke
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: "1.18.21"
            expected: "1.18.21"
          - runtime: latest
            expected: any
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --global opencode-ai@${{ matrix.runtime }}
      - run: bun run package:smoke
        env:
          OPENCODE_SMOKE_STRICT: "1"
          OPENCODE_SMOKE_VERSION: ${{ matrix.expected }}

  paid-openrouter-e2e:
    name: Paid OpenRouter E2E (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_openrouter_e2e
    runs-on: ubuntu-latest
    environment: paid-openrouter-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e
        env:
          RUN_OPENROUTER_E2E: "1"
          RUN_OPENROUTER_CREDITS_E2E: ${{ inputs.run_openrouter_credits_e2e && '1' || '0' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MANAGEMENT_API_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_API_KEY }}
          OPENROUTER_IMAGE_MODEL_E2E: ${{ vars.OPENROUTER_IMAGE_MODEL_E2E }}
          OPENROUTER_IMAGE_REFERENCE_URL_E2E: ${{ vars.OPENROUTER_IMAGE_REFERENCE_URL_E2E }}
